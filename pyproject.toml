[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-football"
version = "0.1.0"
description = "Hierarchical NFL stat distributions and team opportunity research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "polars>=1.17",
    "pyarrow>=18.0",
    "lightgbm>=4.7",
    "scikit-learn>=1.5",
]

[tool.setuptools.packages.find]
where = ["src"]
